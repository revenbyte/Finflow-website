<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Vault Access - FinFlow MW</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; background-color: var(--bg-main); padding: 2rem 1rem;">

    <div class="card" style="width: 100%; max-width: 460px; border: 1px solid var(--border-color); background: var(--bg-card);">
        <div class="card-body" style="padding: 2.5rem 2rem;">
            
            <div class="text-center" style="margin-bottom: 2rem;">
                <h1 class="site-logo" style="font-size: 2rem; margin-bottom: 0.2rem;">FinFlow<span class="logo-highlight">MW</span></h1>
                <p class="site-tagline" style="font-size: 0.75rem;">Initialize New Financial Node</p>
            </div>

            <div id="auth-alert" style="display: none; padding: 0.75rem 1rem; border-radius: var(--radius-sm); font-size: 0.85rem; margin-bottom: 1.5rem; font-weight: 500;"></div>

            <form id="signup-form" style="display: flex; flex-direction: column; gap: 1.1rem;">
                <div>
                    <label style="display:block; color:var(--text-dim); font-size:0.8rem; margin-bottom:0.4rem; font-weight:600; text-transform: uppercase; letter-spacing: 0.05em;"><i class="fa-solid fa-user" style="margin-right: 4px;"></i> Full Name</label>
                    <input type="text" id="signup-name" style="width:100%; padding:0.7rem 1rem; background:rgba(255,255,255,0.02); border:1px solid var(--border-color); border-radius:var(--radius-sm); color:white; font-family: inherit; font-size: 0.9rem;" placeholder="Elijah Mponda" required>
                </div>

                <div>
                    <label style="display:block; color:var(--text-dim); font-size:0.8rem; margin-bottom:0.4rem; font-weight:600; text-transform: uppercase; letter-spacing: 0.05em;"><i class="fa-solid fa-briefcase" style="margin-right: 4px;"></i> Enterprise / Trading Name</label>
                    <input type="text" id="signup-business" style="width:100%; padding:0.7rem 1rem; background:rgba(255,255,255,0.02); border:1px solid var(--border-color); border-radius:var(--radius-sm); color:white; font-family: inherit; font-size: 0.9rem;" placeholder="MW Tech Solutions" required>
                </div>

                <div>
                    <label style="display:block; color:var(--text-dim); font-size:0.8rem; margin-bottom:0.4rem; font-weight:600; text-transform: uppercase; letter-spacing: 0.05em;"><i class="fa-solid fa-envelope" style="margin-right: 4px;"></i> Communication Email</label>
                    <input type="email" id="signup-email" style="width:100%; padding:0.7rem 1rem; background:rgba(255,255,255,0.02); border:1px solid var(--border-color); border-radius:var(--radius-sm); color:white; font-family: inherit; font-size: 0.9rem;" placeholder="ej@company.mw" required>
                </div>

                <div>
                    <label style="display:block; color:var(--text-dim); font-size:0.8rem; margin-bottom:0.4rem; font-weight:600; text-transform: uppercase; letter-spacing: 0.05em;"><i class="fa-solid fa-key" style="margin-right: 4px;"></i> Secure Password</label>
                    <input type="password" id="signup-password" style="width:100%; padding:0.7rem 1rem; background:rgba(255,255,255,0.02); border:1px solid var(--border-color); border-radius:var(--radius-sm); color:white; font-family: inherit; font-size: 0.9rem;" placeholder="••••••••" minlength="6" required>
                </div>

                <div>
                    <label style="display:block; color:var(--text-dim); font-size:0.8rem; margin-bottom:0.4rem; font-weight:600; text-transform: uppercase; letter-spacing: 0.05em;"><i class="fa-solid fa-shield-halved" style="margin-right: 4px;"></i> Confirm Password</label>
                    <input type="password" id="signup-confirm-password" style="width:100%; padding:0.7rem 1rem; background:rgba(255,255,255,0.02); border:1px solid var(--border-color); border-radius:var(--radius-sm); color:white; font-family: inherit; font-size: 0.9rem;" placeholder="••••••••" minlength="6" required>
                </div>

                <button type="submit" id="signup-btn" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem; padding: 0.85rem;"><i class="fa-solid fa-user-plus"></i> Initialize Account Node</button>
            </form>

            <div class="text-center" style="margin-top: 2rem; border-top: 1px solid var(--border-color); padding-top: 1.25rem;">
                <p style="color: var(--text-muted); font-size: 0.85rem;">
                    Already have a registered vault? <a href="login.html" style="color: var(--primary); text-decoration: none; font-weight: 600;">Sign In here</a>
                </p>
            </div>

        </div>
    </div>

    <script>
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', () => input.style.borderColor = 'var(--primary)');
            input.addEventListener('blur', () => input.style.borderColor = 'var(--border-color)');
        });
    </script>
    <script src="signup.js"></script>
</body>
</html>
