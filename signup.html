<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Vault Access - FinFlow MW</title>
    <link rel="stylesheet" href="style.css">
    <!-- Supabase JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: var(--space-sm);">

    <!-- ===== CENTRAL AUTH CONTAINER ===== -->
    <div class="card floating-card" style="width: 100%; max-width: 450px; border: 1px solid rgba(255, 255, 255, 0.05); background: rgba(26, 34, 45, 0.9); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);">
        <div class="card-body" style="padding: var(--space-md);">
            
            <!-- Logo Section -->
            <div class="text-center" style="margin-bottom: var(--space-md);">
                <h1 class="site-logo" style="font-size: 2.2rem; margin-bottom: 0.2rem;">FinFlow<span class="logo-highlight">MW</span></h1>
                <p class="site-tagline" style="font-size: 0.85rem; letter-spacing: 1px; text-transform: uppercase;">Security Gateway</p>
            </div>

            <div class="text-center" style="margin-bottom: var(--space-md);">
                <h3 class="text-gradient" style="font-size: 1.6rem; margin-bottom: 0.4rem;">Create Account</h3>
                <p style="color: var(--text-muted); font-size: 0.9rem;">Register to deploy your encrypted ledger vault.</p>
            </div>

            <!-- Status Alert Box -->
            <div id="auth-alert" class="badge" style="display: none; width: 100%; padding: 0.75rem; margin-bottom: 1.2rem; border-radius: var(--radius-medium); text-align: left; font-size: 0.85rem; line-height: 1.4;"></div>

            <!-- Sign Up Form -->
            <form id="signup-form" style="display: flex; flex-direction: column; gap: 1.2rem;">
                <div>
                    <label style="display:block; color:var(--text-secondary); font-size:0.85rem; margin-bottom:0.4rem; font-weight:600;">Email Address</label>
                    <input type="email" id="signup-email" style="width:100%; padding:0.75rem; background:var(--bg-light); border:1px solid rgba(255,255,255,0.05); border-radius:var(--radius-small); color:white; font-family: inherit;" placeholder="you@domain.com" required>
                </div>

                <div>
                    <label style="display:block; color:var(--text-secondary); font-size:0.85rem; margin-bottom:0.4rem; font-weight:600;">Secure Password</label>
                    <input type="password" id="signup-password" style="width:100%; padding:0.75rem; background:var(--bg-light); border:1px solid rgba(255,255,255,0.05); border-radius:var(--radius-small); color:white; font-family: inherit;" placeholder="••••••••" minlength="6" required>
                </div>

                <div>
                    <label style="display:block; color:var(--text-secondary); font-size:0.85rem; margin-bottom:0.4rem; font-weight:600;">Confirm Password</label>
                    <input type="password" id="signup-confirm-password" style="width:100%; padding:0.75rem; background:var(--bg-light); border:1px solid rgba(255,255,255,0.05); border-radius:var(--radius-small); color:white; font-family: inherit;" placeholder="••••••••" minlength="6" required>
                </div>

                <button type="submit" id="signup-btn" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem; padding: 0.85rem;">Initialize Registration</button>
            </form>

            <!-- Footer Navigation Link -->
            <div class="text-center" style="margin-top: var(--space-md); border-top: 1px solid rgba(255,255,255,0.05); padding-top: var(--space-sm);">
                <p style="color: var(--text-muted); font-size: 0.85rem;">
                    Already have a registered vault? <a href="login.html" style="color: var(--primary); text-decoration: none; font-weight: 600; transition: var(--transition-fast);">Sign In</a>
                </p>
            </div>

        </div>
    </div>

    <!-- Script connection for auth controller -->
    <script src="signup.js"></script>
</body>
</html>
