<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ledger Book - FinFlow MW</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div class="app-layout">
        
        <aside class="sidebar-desktop">
            <div class="sidebar-header">
                <h1 class="site-logo">FinFlow<span class="logo-highlight">MW</span></h1>
                <p class="site-tagline">Ledger Book Matrix</p>
            </div>
            
            <nav class="sidebar-nav">
                <ul class="nav-list">
                    <li><a href="dashboard.html" class="nav-link"><i class="fa-solid fa-chart-columns"></i> Dashboard</a></li>
                    <li><a href="transactions.html" class="nav-link active"><i class="fa-solid fa-book"></i> Ledger Book</a></li>
                    <li><a href="reports.html" class="nav-link"><i class="fa-solid fa-chart-pie"></i> Reports</a></li>
                    <li><a href="settings.html" class="nav-link"><i class="fa-solid fa-sliders"></i> Settings</a></li>
                </ul>
            </nav>
            
            <div class="sidebar-footer">
                <button id="logout-btn" class="btn btn-outline" style="width: 100%;"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
            </div>
        </aside>

        <nav class="mobile-floating-nav">
            <a href="dashboard.html" class="mobile-nav-item"><i class="fa-solid fa-chart-columns"></i></a>
            <a href="transactions.html" class="mobile-nav-item active"><i class="fa-solid fa-book"></i></a>
            <a href="reports.html" class="mobile-nav-item"><i class="fa-solid fa-chart-pie"></i></a>
            <a href="settings.html" class="mobile-nav-item"><i class="fa-solid fa-sliders"></i></a>
        </nav>

        <main class="main-content">
            <div class="container" style="padding-top: 3rem;">
                
                <div id="loading" class="text-center" style="padding: 5rem 0;">
                    <h3 class="text-gradient"><i class="fa-solid fa-circle-notch fa-spin"></i> Streaming operational rows...</h3>
                </div>

                <div id="ledger-content" style="display: none;">
                    <header class="mb-5">
                        <h2 class="text-gradient">Financial Ledger Sheets</h2>
                        <p class="text-muted mt-2">Log operations or pull structured data spreadsheets directly.</p>
                    </header>

                    <div class="grid grid-3" style="grid-template-columns: 0.9fr 1.1fr; gap: 2rem;">
                        
                        <div class="card" style="height: fit-content;">
                            <div class="card-body">
                                <h3 class="mb-3" style="font-size: 1.1rem;"><i class="fa-solid fa-pen-to-square" style="color: var(--primary);"></i> Log Transaction</h3>
                                
                                <div id="form-alert" style="display:none; padding:0.6rem; border-radius:var(--radius-sm); font-size:0.8rem; margin-bottom:1rem;"></div>

                                <form id="transaction-form" style="display:flex; flex-direction:column; gap:1rem;">
                                    <div>
                                        <label style="display:block; color:var(--text-dim); font-size:0.75rem; font-weight:600; margin-bottom:0.3rem;">STREAM DIRECTION</label>
                                        <select id="tx-type" style="width:100%; padding:0.65rem; background:#111622; border:1px solid var(--border-color); border-radius:var(--radius-sm); color:white; font-family:inherit;">
                                            <option value="income">Income (+ MWK)</option>
                                            <option value="expense">Expense (- MWK)</option>
                                        </select>
                                    </div>

                                    <div>
                                        <label style="display:block; color:var(--text-dim); font-size:0.75rem; font-weight:600; margin-bottom:0.3rem;">VOLUME VALUE (MWK)</label>
                                        <input type="number" id="tx-amount" step="0.01" style="width:100%; padding:0.65rem; background:#111622; border:1px solid var(--border-color); border-radius:var(--radius-sm); color:white; font-family:inherit;" placeholder="50000" required>
                                    </div>

                                    <div>
                                        <label style="display:block; color:var(--text-dim); font-size:0.75rem; font-weight:600; margin-bottom:0.3rem;">CATEGORY</label>
                                        <input type="text" id="tx-category" style="width:100%; padding:0.65rem; background:#111622; border:1px solid var(--border-color); border-radius:var(--radius-sm); color:white; font-family:inherit;" placeholder="Sales, Inventory, Rent" required>
                                    </div>

                                    <div>
                                        <label style="display:block; color:var(--text-dim); font-size:0.75rem; font-weight:600; margin-bottom:0.3rem;">MEMO DESCRIPTION (OPTIONAL)</label>
                                        <input type="text" id="tx-desc" style="width:100%; padding:0.65rem; background:#111622; border:1px solid var(--border-color); border-radius:var(--radius-sm); color:white; font-family:inherit;" placeholder="Invoice details...">
                                    </div>

                                    <button type="submit" id="save-btn" class="btn btn-primary" style="width:100%; padding:0.75rem; margin-top:0.5rem;"><i class="fa-solid fa-cube"></i> Commit to Vault</button>
                                </form>
                            </div>
                        </div>

                        <div class="card">
                            <div class="card-body">
                                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem; flex-wrap:wrap; gap:1rem;">
                                    <h3><i class="fa-solid fa-list-check" style="color:var(--primary);"></i> Transaction History</h3>
                                    
                                    <div style="display:flex; gap:0.5rem;">
                                        <select id="month-filter" style="padding:0.4rem 0.6rem; background:#111622; border:1px solid var(--border-color); border-radius:var(--radius-sm); color:white; font-size:0.85rem;">
                                            <option value="all">All Entries</option>
                                            <option value="0">January</option>
                                            <option value="1">February</option>
                                            <option value="2">March</option>
                                            <option value="3">April</option>
                                            <option value="4">May</option>
                                            <option value="5">June</option>
                                            <option value="6">July</option>
                                            <option value="7">August</option>
                                            <option value="8">September</option>
                                            <option value="9">October</option>
                                            <option value="10">November</option>
                                            <option value="11">December</option>
                                        </select>
                                        <button id="export-csv-btn" class="btn btn-outline" style="padding:0.4rem 0.8rem; font-size:0.8rem;"><i class="fa-solid fa-file-csv" style="color:var(--success);"></i> Export CSV</button>
                                    </div>
                                </div>
                                
                                <div style="overflow-x: auto;">
                                    <table style="width: 100%; border-collapse: collapse;">
                                        <thead>
                                            <tr style="text-align: left; color: var(--text-muted); font-size: 0.75rem; border-bottom: 1px solid var(--border-color); text-transform: uppercase; letter-spacing: 0.05em;">
                                                <th style="padding: 12px 15px;">Date</th>
                                                <th style="padding: 12px 15px;">Details</th>
                                                <th style="padding: 12px 15px; text-align: right;">Volume Amount</th>
                                            </tr>
                                        </thead>
                                        <tbody id=\"history-table-body\">
                                            </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="auth.js"></script>
</body>
</html>
