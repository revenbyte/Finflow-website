<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - FinFlow MW</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <!-- Header -->
    <header id="main-header">
        <div class="container header-container">
            <div class="logo-area">
                <a href="index.html" class="logo-link">
                    <h1 class="site-logo">FinFlow<span class="logo-highlight">MW</span></h1>
                </a>
            </div>
            <nav id="main-nav" class="main-navigation">
                <ul class="nav-list">
                    <li class="nav-item"><a href="index.html" class="nav-link">Home</a></li>
                    <li class="nav-item"><a href="about.html" class="nav-link">About</a></li>
                    <li class="nav-item"><a href="blog.html" class="nav-link">Blog</a></li>
                    <li class="nav-item"><a href="contact.html" class="nav-link active">Contact</a></li>
                </ul>
                <div class="auth-buttons" id="nav-auth-container">
                    <a href="login.html" class="btn btn-login">Sign In</a>
                    <a href="signup.html" class="btn btn-signup">Start Free</a>
                </div>
            </nav>
        </div>
    </header>

    <!-- Contact Form Section -->
    <section class="section">
        <div class="container" style="max-width: 600px;">
            <div class="card animate-fade-up">
                <div class="card-body">
                    <h2 class="section-title text-gradient text-center mb-4">Get in Touch</h2>
                    <p class="text-center mb-4">Have questions about setting up your business profile? Drop us a line below.</p>
                    
                    <form id="contact-form" onsubmit="handleContact(event)">
                        <div class="form-group mb-3">
                            <label for="contact-name" class="form-label">Your Name</label>
                            <input type="text" id="contact-name" class="form-input" required placeholder="E.g., Chinsinsi Phiri">
                        </div>
                        <div class="form-group mb-3">
                            <label for="contact-email" class="form-label">Email Address</label>
                            <input type="email" id="contact-email" class="form-input" required placeholder="name@company.mw">
                        </div>
                        <div class="form-group mb-4">
                            <label for="contact-message" class="form-label">Message / Query</label>
                            <textarea id="contact-message" class="form-input" rows="5" required placeholder="How can we help your business today?"></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Send Message</button>
                    </form>
                    <div id="contact-alert" class="alert mt-3" style="display: none;"></div>
                </div>
            </div>
        </div>
    </section>

    <footer id="main-footer">
        <div class="container text-center">
            <p>&copy; 2026 FinFlow MW. Blantyre, Malawi.</p>
        </div>
    </footer>

    <script>
        function handleContact(e) {
            e.preventDefault();
            const alertBox = document.getElementById('contact-alert');
            alertBox.className = "alert alert-success mt-3";
            alertBox.innerText = "Zikomo! Your message has been sent successfully. We will get back to you shortly.";
            alertBox.style.display = "block";
            document.getElementById('contact-form').reset();
        }
    </script>
    <script src="auth-check.js"></script>
</body>
</html>
