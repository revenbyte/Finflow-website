<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - FinFlow MW</title>
    <link rel="stylesheet" href="style.css">
    <!-- Supabase JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <!-- ===== MARKETING CONTAINER HEADER ===== -->
    <header class="marketing-header">
        <div class="container header-viewport">
            <div class="logo-area">
                <a href="index.html" style="text-decoration: none;">
                    <h1 class="site-logo">FinFlow<span class="logo-highlight">MW</span></h1>
                </a>
            </div>
            <nav class="marketing-nav">
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="blog.html">Blog</a></li>
                    <li><a href="contact.html" class="active">Contact</a></li>
                </ul>
                <div class="auth-cluster" id="nav-auth-container">
                    <a href="login.html" class="btn btn-outline">Sign In</a>
                    <a href="signup.html" class="btn btn-primary">Start Free</a>
                </div>
            </nav>
        </div>
    </header>

    <!-- ===== CONTACT FORM VIEWPORT SECTION ===== -->
    <main style="padding-top: 100px;">
        <section style="padding: var(--space-xl) 0;">
            <div class="container" style="max-width: 600px; margin: 0 auto;">
                
                <div class="text-center mb-5">
                    <h2 class="text-gradient" style="font-size: var(--font-lg); font-weight: 800; margin-bottom: 0.5rem;">Get in Touch</h2>
                    <p style="color: var(--text-secondary); font-size: 0.95rem;">Have questions about setting up your business profile? Drop us a line below.</p>
                </div>

                <div class="card floating-card">
                    <div class="card-body" style="padding: var(--space-md);">
                        
                        <!-- Dynamic Feedback Alert Badge -->
                        <div id="contact-alert" class="badge" style="display: none; width: 100%; padding: 0.75rem; margin-bottom: 1.2rem; border-radius: var(--radius-medium); text-align: left; font-size: 0.85rem;"></div>
                        
                        <form id="contact-form" onsubmit="handleContact(event)" style="display: flex; flex-direction: column; gap: 1.2rem;">
                            <div>
                                <label style="display:block; color:var(--text-secondary); font-size:0.85rem; margin-bottom:0.4rem; font-weight:600;">Your Name</label>
                                <input type="text" id="contact-name" style="width:100%; padding:0.75rem; background:var(--bg-light); border:1px solid rgba(255,255,255,0.05); border-radius:var(--radius-small); color:white; font-family: inherit;" required placeholder="E.g., Chinsinsi Phiri">
                            </div>
                            <div>
                                <label style="display:block; color:var(--text-secondary); font-size:0.85rem; margin-bottom:0.4rem; font-weight:600;">Email Address</label>
                                <input type="email" id="contact-email" style="width:100%; padding:0.75rem; background:var(--bg-light); border:1px solid rgba(255,255,255,0.05); border-radius:var(--radius-small); color:white; font-family: inherit;" required placeholder="name@company.mw">
                            </div>
                            <div>
                                <label style="display:block; color:var(--text-secondary); font-size:0.85rem; margin-bottom:0.4rem; font-weight:600;">Message / Query</label>
                                <textarea id="contact-message" style="width:100%; padding:0.75rem; background:var(--bg-light); border:1px solid rgba(255,255,255,0.05); border-radius:var(--radius-small); color:white; font-family: inherit; resize: vertical;" rows="5" required placeholder="How can we help your business today?"></textarea>
                            </div>
                            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.85rem; margin-top: 0.5rem;">Send Message</button>
                        </form>

                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- ===== MARKETING FOOTER ===== -->
    <footer style="padding: var(--space-lg) 0; border-top: 1px solid rgba(255, 255, 255, 0.03); margin-top: var(--space-xl);">
        <div class="container text-center">
            <p style="color: var(--text-muted); font-size: 0.85rem;">&copy; 2026 FinFlow MW. Blantyre, Malawi.</p>
        </div>
    </footer>

    <script>
        function handleContact(e) {
            e.preventDefault();
            const alertBox = document.getElementById('contact-alert');
            
            // Apply premium dark-alert theme variable styling
            alertBox.style.background = "rgba(46, 125, 50, 0.15)";
            alertBox.style.color = "#2ecc71";
            alertBox.style.border = "1px solid rgba(46, 125, 50, 0.3)";
            alertBox.innerText = "Zikomo! Your message has been sent successfully. We will get back to you shortly.";
            alertBox.style.display = "block";
            
            document.getElementById('contact-form').reset();
        }
    </script>
    <script src="auth.js"></script>
</body>
</html>
