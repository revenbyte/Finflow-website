<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - FinFlow MW</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="#06080a">
    <meta name="apple-mobile-web-app-title" content="FinFlow MW">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; background-color: var(--bg-main); padding: 1rem;">

    <div class="card" style="width: 100%; max-width: 420px; border: 1px solid var(--border-color); background: var(--bg-card);">
        <div class="card-body" style="padding: 2.5rem 2rem;">
            
            <div class="text-center" style="margin-bottom: 2rem;">
                <h1 class="site-logo" style="font-size: 2rem; margin-bottom: 0.2rem;">FinFlow<span class="logo-highlight">MW</span></h1>
                <p class="site-tagline" style="font-size: 0.75rem;">Secure Vault Authentication</p>
            </div>

            <div id="auth-alert" style="display: none; padding: 0.75rem 1rem; border-radius: var(--radius-sm); font-size: 0.85rem; margin-bottom: 1.5rem; font-weight: 500;"></div>

            <form id="login-form" style="display: flex; flex-direction: column; gap: 1.25rem;">
                <div>
                    <label style="display:block; color: var(--text-dim); font-size:0.8rem; margin-bottom:0.4rem; font-weight:600; text-transform: uppercase; letter-spacing: 0.05em;"><i class="fa-solid fa-envelope" style="margin-right: 4px;"></i> Business Email</label>
                    <input type="email" id="login-email" style="width:100%; padding:0.75rem 1rem; background: rgba(255,255,255,0.02); border:1px solid var(--border-color); border-radius:var(--radius-sm); color:var(--text-main); font-family: inherit; font-size: 0.9rem; transition: var(--transition);" placeholder="name@company.mw" required>
                </div>

                <div>
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem;">
                        <label style="color: var(--text-dim); font-size:0.8rem; font-weight:600; text-transform: uppercase; letter-spacing: 0.05em;"><i class="fa-solid fa-lock" style="margin-right: 4px;"></i> Passkey</label>
                        <a href="recovery.html" style="color: var(--primary); font-size: 0.75rem; text-decoration: none; font-weight: 500;">Forgot passcode?</a>
                    </div>
                    <input type="password" id="login-password" style="width:100%; padding:0.75rem 1rem; background: rgba(255,255,255,0.02); border:1px solid var(--border-color); border-radius:var(--radius-sm); color:var(--text-main); font-family: inherit; font-size: 0.9rem; transition: var(--transition);" placeholder="••••••••" required>
                </div>

                <button type="submit" id="submit-btn" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem; padding: 0.85rem;"><i class="fa-solid fa-right-to-bracket"></i> Unlock Dashboard</button>
            </form>

            <div class="text-center" style="margin-top: 2rem; border-top: 1px solid var(--border-color); padding-top: 1.25rem;">
                <p style="color: var(--text-muted); font-size: 0.85rem;">
                    New to the platform? <a href="signup.html" style="color: var(--primary); text-decoration: none; font-weight: 600;">Create premium account</a>
                </p>
            </div>

        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://xphdrjxemdiuuebpttya.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhwaGRyanhlbWRpdXVlYnB0dHlhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkxMDQwNjcsImV4cCI6MjA5NDY4MDA2N30.rBSJYJjMI5MsNK_J_eMoGr4RpuGr98EFiQW78rF5T84';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Input Focus Highlighting Effects
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', () => input.style.borderColor = 'var(--primary)');
            input.addEventListener('blur', () => input.style.borderColor = 'var(--border-color)');
        });

        document.getElementById('login-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const alertDiv = document.getElementById('auth-alert');
            const submitBtn = document.getElementById('submit-btn');
            
            alertDiv.style.background = "rgba(0, 163, 255, 0.05)";
            alertDiv.style.color = "var(--primary)";
            alertDiv.style.border = "1px solid var(--border-hover)";
            alertDiv.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i> Verifying credentials...`;
            alertDiv.style.display = 'block';
            submitBtn.disabled = true;
            
            try {
                const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
                if (error) throw error;
                
                alertDiv.style.background = "rgba(0, 230, 118, 0.1)";
                alertDiv.style.color = "var(--success)";
                alertDiv.style.border = "1px solid rgba(0, 230, 118, 0.2)";
                alertDiv.innerHTML = `<i class="fa-solid fa-circle-check"></i> Access Granted. Redirecting...`;
                
                setTimeout(() => { window.location.href = 'dashboard.html'; }, 1000);
                
            } catch (error) {
                alertDiv.style.background = "rgba(255, 59, 48, 0.1)";
                alertDiv.style.color = "var(--danger)";
                alertDiv.style.border = "1px solid rgba(255, 59, 48, 0.2)";
                alertDiv.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> Error: ${error.message}`;
                submitBtn.disabled = false;
            }
        });
    </script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js')
                .then(reg => console.log('PWA background engine active and locked in, g.'))
                .catch(err => console.error('PWA installation fault: ', err));
            });
        }
    </script>
</body>
</html>
